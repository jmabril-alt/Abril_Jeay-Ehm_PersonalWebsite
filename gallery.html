    <header class="page-heading"><span class="eyebrow">Moments worth keeping</span><h1>My Gallery</h1><p>A small collection of memories.</p></header>
<div class="gallery">
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery1.jpg"><figcaption>Going to church gives me a quiet break from my busy school week. I sit with my family and listen to stories about being kind to others. When the choir sings, it helps me forget about my homework and tests for a little while. I always leave feeling peaceful and ready to start a new week of classes.</figcaption></figure>
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery2.jpg.jpg" alt="Friends spending time together"><figcaption>Spending time with my friends is my favorite way to relax after a long day at school. We usually sit together during lunch or walk around after class, talking about our favorite games and laughing at silly jokes. Being around them makes even the hardest school days feel much easier and more fun. No matter how much homework we have, hanging out with my friends always puts a smile on my face.</figcaption></figure>
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery3.jpg.jfif" alt="Family"><figcaption>Celebrating Christmas with my family is the best part of my school break. We put up bright lights around the house, share a big meal together, and stay up late telling stories. Since I do not have to worry about classes or homework, I can really enjoy opening gifts and laughing with everyone. Being together during the holidays always makes me feel happy and loved.</figcaption></figure>
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery4.jpg" alt="Celebration"><figcaption>Spending time with my parents is always a meaningful part of my week, as it gives us a chance to slow down, share stories, and simply enjoy each other's company away from our busy daily routines. Whether we are sharing a meal around the dinner table, watching a movie together, or just talking about life, those moments remind me how grateful I am for their constant love, guidance, and support.</figcaption></figure>
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery5.jpg.jfif" alt="Sky and mountains"><figcaption>Looking out over the mountains beneath an open sky is one of the most peaceful sights in nature, where towering peaks meet endless stretches of blue and drifting clouds. As sunlight filters across the ridges and paints the horizon in soft shades of gold, orange, and violet, the vast landscape brings a quiet sense of awe and calm that makes everyday worries feel far away.</figcaption></figure>
  <figure><img src="c:\Users\SDO-SANPABLO-155\Downloads\gallery6.jpg" alt="An unforgettable experience"><figcaption>My Grade 12 graduation day was very special because I got to share it with my mama. Seeing her smile proudly when my name was called made all my hard work in school feel worth it. I am so thankful for her love, patience, and help in getting me to that day, and taking pictures and hugging her after the ceremony is a happy memory I will keep forever.</figcaption></figure>
